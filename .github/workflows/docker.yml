name: Build and Push Docker Images

on:
    push:
        branches:
            - main

jobs:
    docker:
        runs-on: ubuntu-latest

        steps:
           - name: Checkout repository
             uses: actions/checkout@v4

           - name: Login to Docker Hub
             uses: docker/login-action@v3
             with:
                username: ${{secrets.DOCKERHUB_USERNAME}}
                password: ${{secrets.DOCKERHUB_TOKEN}}
            
           - name: Set up Docker Buildx
             uses: docker/setup-buildx-action@v3

           - name: Build and push Client
             uses: docker/build-push-action@v6
             with:
                context: ./client
                push: true
                build-args: | 
                         VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.CLIENT_VITE_CLERK_PUBLISHABLE_KEY }}
                         VITE_BACKEND_URL=${{ secrets.CLIENT_VITE_BACKEND_URL }}
                         VITE_RAZORPAY_KEY_ID=${{ secrets.CLIENT_VITE_RAZORPAY_KEY_ID }}
                tags: | 
                    ${{secrets.DOCKERHUB_USERNAME}}/urbanbasket-client:${{github.sha}}
                    ${{secrets.DOCKERHUB_USERNAME}}/urbanbaket-client:main
                
           - name: Build and push Admin
             uses: docker/build-push-action@v6
             with: 
                context: ./admin
                push: true
                build-args: | 
                          VITE_BACKEND_URL=${{ secrets.ADMIN_VITE_BACKEND_URL }}
                          VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.ADMIN_VITE_CLERK_PUBLISHABLE_KEY }}
                tags: | 
                    ${{secrets.DOCKERHUB_USERNAME}}/urbanbasket-admin:${{github.sha}}
                    ${{secrets.DOCKERHUB_USERNAME}}/urbanbasket-admin:main
            
           - name: Build and push Server
             uses: docker/build-push-action@v6
             with:
                context: ./server
                push: true
                tags: |
                    ${{secrets.DOCKERHUB_USERNAME}}/urbanbasket-server:${{github.sha}}
                    ${{secrets.DOCKERHUB_USERNAME}}/urbanbasket-server:main